name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      
      - name: Install dependencies
        run: bun install
      
      - name: Build binaries
        run: |
          bun build --compile src/index.ts --outfile tstore-linux
          bun build --compile src/index.ts --target=bun-darwin-x64 --outfile tstore-macos-x64
          bun build --compile src/index.ts --target=bun-darwin-arm64 --outfile tstore-macos-arm64
          bun build --compile src/index.ts --target=bun-windows-x64 --outfile tstore-windows.exe
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            tstore-linux
            tstore-macos-x64
            tstore-macos-arm64
            tstore-windows.exe
          draft: false
          prerelease: false
          generate_release_notes: true

  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      
      - name: Install dependencies
        run: bun install
      
      - name: Build TypeScript
        run: bun run build
      
      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
